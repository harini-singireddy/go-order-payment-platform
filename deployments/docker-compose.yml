services:
  postgres:
    image: postgres:16-alpine
    container_name: opp-postgres
    environment:
      POSTGRES_USER: opp
      POSTGRES_PASSWORD: opp_dev_password
      POSTGRES_DB: opp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opp -d opp"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - opp-net

  redis:
    image: redis:7-alpine
    container_name: opp-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - opp-net

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: opp-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: opp
      RABBITMQ_DEFAULT_PASS: opp_dev_password
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - opp-net

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: opp-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    networks:
      - opp-net

  grafana:
    image: grafana/grafana:11.2.0
    container_name: opp-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - opp-net

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  prometheus_data:
  grafana_data:

networks:
  opp-net:
    driver: bridge
