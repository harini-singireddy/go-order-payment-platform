name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true
          cache-dependency-path: |
            **/go.sum

      - name: Create workspace
        run: |
          go work init
          go work use ./pkg ./proto ./services/gateway ./services/order ./services/payment ./services/inventory ./services/notification
          go work sync

      - name: Build all modules
        run: |
          set -e
          for m in pkg proto services/gateway services/order services/payment services/inventory services/notification; do
            echo "==> building $m"
            (cd "$m" && go build ./...)
          done

      - name: Vet
        run: |
          set -e
          for m in pkg proto services/gateway services/order services/payment services/inventory services/notification; do
            echo "==> vet $m"
            (cd "$m" && go vet ./...)
          done

      - name: Integration test
        run: |
          cd services/order
          go test -v -race -timeout 180s ./integration/...